spring.application.name=medivice
server.port=${SERVER_PORT:8080}

# DA 데이터 파이프라인(.env)과 동일한 환경변수 이름을 그대로 씁니다 (PGHOST/PGPORT/...).
# currentSchema=medivice 로 01_schema_ddl.sql 이 만든 스키마를 기본 검색 경로로 잡습니다.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:medivice_db}?currentSchema=medivice,public
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Sprint 1: 인증을 구현하지 않는 대신 고정된 데모 사용자로 전체 API를 시연합니다.
# sql/05_backend_extensions.sql 이 이 로그인 아이디로 사용자를 미리 만들어 둡니다.
medivice.demo-user-login-id=${MEDIVICE_DEMO_USER:demo_user}

# 메디라이트 판정에 적용 중인 규칙 버전 표기 (판정 사유의 "출처·확인일" 요구사항용).
medivice.rule-version=${MEDIVICE_RULE_VERSION:DUR-2026.09}

# Sprint 3 확장 지점: 값만 바꾸면 AiClient 구현체를 교체할 수 있도록 설정으로 뺐습니다.
# openai로 바꾸면 OpenAiClient가 활성화되고, OPENAI_API_KEY 환경변수가 있어야 합니다.
medivice.ai.provider=${MEDIVICE_AI_PROVIDER:mock}

# UC28·29 보고서(language=en)에서 사용자가 한국어로 적은 증상명·메모를 DeepL로 옮길 때 씁니다.
# 비어 있으면 TranslationService가 원문을 그대로 돌려줍니다(번역 실패가 보고서 생성을 막지 않음).
medivice.translate.api-key=${DEEPL_API_KEY:}

# UC8~10 사진 등록(OCR) 업로드 용량. 기본 1MB로는 휴대폰 사진이 거의 다 잘립니다.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Vite 개발 서버(기본 5173 포트)에서의 접근을 허용합니다.
medivice.cors.allowed-origins=${MEDIVICE_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
