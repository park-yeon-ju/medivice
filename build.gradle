plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.project'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	// openai-java가 자기 내부용으로 끌어오는 swagger-annotations(비-jakarta, 2.2.31)가
	// springdoc의 swagger-annotations-jakarta(2.2.52)와 같은 패키지·클래스명이라 충돌한다
	// (버전이 섞이면 NoSuchMethodError: Schema.$dynamicRef 로 /v3/api-docs가 500난다).
	// 우리 코드에서 이 트랜지티브 의존성을 쓸 일이 없으므로 제외한다.
	implementation('com.openai:openai-java:4.56.0') {
		exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
	}
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	runtimeOnly 'org.postgresql:postgresql'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
